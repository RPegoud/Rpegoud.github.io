title: "Rainbow: The Colorful Evolution of Deep Q-Networks"
claim: "Breaking down Rainbow's six independently-published DQN extensions in a shared JAX (Stoix) implementation shows how double Q-learning, prioritized replay, dueling networks, multi-step returns, distributional RL, and noisy nets compose into one architecture."
